name: Build Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 is unavailable on newer Ubuntu and macOS arm64 runners.
        os: [windows-latest, ubuntu-24.04, macos-15-intel]
        # Quote versions so YAML does not turn 3.10 into 3.1.
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "WabbajackViewer" wabbajack_viewer.py
    
    - name: Upload Windows executable
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v7
      with:
        name: WabbajackViewer-Windows-${{ matrix.python-version }}
        path: dist/WabbajackViewer.exe
    
    - name: Upload Linux executable
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: WabbajackViewer-Linux-${{ matrix.python-version }}
        path: dist/WabbajackViewer
    
    - name: Upload macOS executable
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v7
      with:
        name: WabbajackViewer-macOS-${{ matrix.python-version }}
        path: dist/WabbajackViewer

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
    
    - name: Prepare Release Assets
      run: |
        mkdir -p release-assets
        # Artifact directories carry the platform/version; filenames do not.
        for artifact in artifacts/WabbajackViewer-*; do
          name="$(basename "$artifact")"
          case "$name" in
            WabbajackViewer-Windows-*)
              cp "$artifact/WabbajackViewer.exe" "release-assets/$name.exe"
              ;;
            WabbajackViewer-Linux-*|WabbajackViewer-macOS-*)
              cp "$artifact/WabbajackViewer" "release-assets/$name"
              chmod +x "release-assets/$name"
              ;;
          esac
        done
        
        # Create a zip file with all executables
        cd release-assets
        zip -r WabbajackViewer-All-Platforms.zip *
        
        ls -la
    
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v3
      with:
        files: |
          release-assets/*.exe
          release-assets/WabbajackViewer-Linux-*
          release-assets/WabbajackViewer-macOS-*
          release-assets/WabbajackViewer-All-Platforms.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
