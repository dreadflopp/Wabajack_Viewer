name: Create Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15-intel]
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "WabbajackViewer" wabbajack_viewer.py
    
    - name: Upload Windows executable
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v7
      with:
        name: WabbajackViewer-Windows
        path: dist/WabbajackViewer.exe
    
    - name: Upload Linux executable
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: WabbajackViewer-Linux
        path: dist/WabbajackViewer
    
    - name: Upload macOS executable
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v7
      with:
        name: WabbajackViewer-macOS
        path: dist/WabbajackViewer

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
    
    - name: Prepare release files
      run: |
        mkdir -p release-files
        cp artifacts/WabbajackViewer-Windows/WabbajackViewer.exe release-files/WabbajackViewer-Windows.exe
        for platform in Linux macOS; do
          cp "artifacts/WabbajackViewer-$platform/WabbajackViewer" "release-files/WabbajackViewer-$platform"
          chmod +x "release-files/WabbajackViewer-$platform"
        done
        
        # Create a zip with all files
        cd release-files
        zip -r WabbajackViewer-All-Platforms.zip *
        ls -la
    
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          release-files/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
